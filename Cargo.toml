[workspace]
resolver = "2"
members = ["xpq", "xpq-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
async-stream = "0.3"
backon = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures = "0.3"
insta = "=1.43.2"
pgdb = "0.5"
rmp-serde = "1"
rmpv = { version = "1", features = ["with-serde"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "migrate"] }
tabled = "0.17"
terminal_size = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
toml = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }
