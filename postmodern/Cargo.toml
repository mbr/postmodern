[package]
name = "postmodern"
description = "Postgres-backed job queue with transaction-based locking."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["postgres", "job-queue", "async", "background-jobs", "sqlx"]
categories = ["asynchronous", "database"]

[dependencies]
anyhow = { workspace = true }
async-stream = "0.3"
backon = "1"
chrono = "0.4"
dirs = "6"
display_full_error = { version = "1", features = ["alloc"] }
futures = { workspace = true }
rmp-serde = "1"
serde = { workspace = true }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono", "migrate"] }
thiserror = "2"
tokio = { workspace = true }
toml = "1"
tracing = "0.1"
uuid = { workspace = true }
uuid-suffix = "0.1.2"

[dev-dependencies]
pgdb = "0.6"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
